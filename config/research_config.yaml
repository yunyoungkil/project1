# 리서치 시스템 설정. 코드에 하드코딩하지 않고 여기서 조정한다.

paths:
  db_path: data/research.db
  keyword_pool_path: data/keyword_pool.yaml
  reports_dir: reports
  oauth_token_path: config/youtube_token.json

search:
  # 검색 1건당 최대 결과 수 (search.list maxResults)
  max_results_per_query: 15
  # 동일 검색어를 이 시간(시간 단위) 안에는 다시 호출하지 않는다.
  cache_ttl_hours: 168 # 7일
  # 한국어 콘텐츠 우선 (relevanceLanguage)
  relevance_language: ko
  region_code: KR

baseline:
  # 채널 baseline 계산에 사용할 최근 영상 수
  sample_size: 30
  min_sample_size: 5
  # 이미 계산한 채널 baseline을 이 시간(시간 단위) 안에는 재사용하고 다시 API를 호출하지 않는다.
  cache_ttl_hours: 168 # 7일

  # 이보다 오래된 영상은 baseline에서 제외 (일 단위), null이면 제한 없음
  max_age_days: 730
  # 라이브 방송/프리미어는 baseline에서 제외
  exclude_live: true

content_type:
  short_max_seconds: 60
  ambiguous_max_seconds: 180 # 60~180초는 unknown 처리 (Shorts 3분 확장 정책으로 판별 불확실)

outlier:
  thresholds:
    notable: 2
    strong: 5
    very_strong: 10
    exceptional: 20
  # 이 등급 이상만 outlier_scores에 저장 (quota/저장공간 절약)
  min_grade_to_store: notable

opportunity_score:
  weights:
    outlier_strength: 0.4
    views_velocity: 0.2
    subscriber_ratio: 0.1
    engagement: 0.1
    relevance: 0.2
  caps:
    outlier_ratio_cap: 50 # 이 배수에서 outlier_strength 만점
    views_per_day_cap: 5000 # 이 값에서 views_velocity 만점
    subscriber_ratio_cap: 5 # 구독자 대비 5배 조회수에서 만점
    like_rate_cap: 0.08
    comment_rate_cap: 0.01
  neutral_score_when_missing: 50

topic_score:
  market_demand_top_n: 5
  market_demand_weights:
    avg_opportunity: 0.7
    outlier_count: 0.3
  outlier_count_cap: 10
  fit_neutral_score: 50
  # categories with fewer distinct matched candidate videos than this are reported as
  # "insufficient_data" rather than getting a market_demand_score of 0.
  min_candidate_videos: 10

gemini:
  model: gemini-flash-latest
  timeout_seconds: 30
  max_output_tokens: 1024
  # `research packages` asks for a 5-item JSON array (title/thumbnail/angle/driver per item) in a
  # single call, which needs much more room than the single-object prompts other stages use.
  max_output_tokens_packages: 3000
  # `research blueprint` asks for one large nested structure (viewer contract, sections, example
  # ladder, hook, shorts candidates, etc.) in a single call -- needs even more room.
  max_output_tokens_blueprint: 6000
  # `research script` asks for full Korean narration text plus 09-2/09-3 Content Block metadata
  # (learning_function, required_content, retention_intent, 8-signal media_affinity, etc.) for
  # every section plus opening/mini success/ending in one call -- the largest single response in
  # the pipeline; 8000 truncated mid-response once the per-block metadata was added.
  max_output_tokens_script: 12000
  # `research direction` only asks for a short 3-gate judgment (podcast/clip/explanation
  # necessity) or, for PODCAST, a dialogue-beat script -- comparable to the blueprint prompt.
  max_output_tokens_direction: 6000

clip_score:
  weights:
    learning_match: 0.30
    phenomenon_clarity: 0.25
    replay_value: 0.20
    context_independence: 0.15
    audio_usability: 0.10
  grade_thresholds:
    strong: 85
    good: 70
    usable: 55
  # candidates scoring below this on learning_match alone are hard-excluded (spec: "분석 대상
  # 발화를 특정할 수 없음"), everything else is kept and soft-scored instead.
  min_learning_match_to_keep: 10
  # segment length sweet spot for replay_value -- too short feels abrupt, too long is hard to
  # loop; both ends taper off rather than hard-cutting.
  replay_ideal_seconds: [2, 6]
  # audio_usability when a transcript segment doesn't carry its own audio_quality hint -- real
  # audio QC isn't implemented, so this stays a documented neutral placeholder, not a real signal.
  neutral_audio_quality: 65
  # context padding added around a focus segment when building the CONTEXT clip boundary.
  context_padding_seconds: 2.0

production_planner:
  # speech/clip/replay/interaction/visual-type signal counts above these totals bump Production
  # Complexity up a level (spec section 33) -- thresholds live here instead of scattered magic
  # numbers in code.
  complexity_thresholds:
    medium_at_total_signals: 12
    high_at_total_signals: 22

my_channel:
  lookback_days: 90
  # traffic source costs one extra Analytics query per video, so only fetch it for the
  # top-N most-viewed videos in the lookback window instead of the whole channel history.
  traffic_source_top_n: 20

channel:
  name: 이해하면 쉬운 영어
  audience: 영어를 배운 적은 있지만 여전히 영어가 어려운 성인 왕초보, 알파벳은 알지만 단어 읽기·듣기·실제 발음에서 어려움을 겪는 학습자
  philosophy: 영어는 외울수록 어려워지고, 이해할수록 쉬워집니다.
  focus_areas:
    - 영어 읽기 원리
    - 철자와 발음
    - 강세
    - schwa
    - 연음
    - 약화
    - 묵음
    - 실제 원어민 발음
    - 영어가 안 들리는 이유
    - 처음 보는 단어 읽기

schedule:
  monday: reading
  tuesday: listening
  wednesday: beginner
  thursday: pronunciation
  friday: speaking
  saturday: vocabulary
  sunday: report

quota:
  daily_unit_budget: 10000
  search_list_cost: 100
  list_endpoint_cost: 1
